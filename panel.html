<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emby Multi Proxy</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#121a2d;--line:#26334f;--text:#eaf0ff;--muted:#94a3bd;--ok:#4ade80;--warn:#fbbf24;--danger:#fb7185;--accent:#7c9cff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(145deg,#08101d,#101933);color:var(--text);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:13px}.card{background:rgba(18,26,45,.96);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 10px 30px #0003}button,input{font:inherit}.btn{border:1px solid var(--line);background:#1a2540;color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}.btn:hover{filter:brightness(1.12)}.primary{background:#5878eb;border-color:#6f8aff}.danger{background:#44202c;border-color:#743346}.grid{display:grid;grid-template-columns:1fr 1.2fr .8fr .8fr auto;gap:8px;align-items:center}.head{color:var(--muted);font-size:12px}.site{padding:10px 0;border-top:1px solid var(--line)}.badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:12px;background:#243251}.ok{color:var(--ok)}.off{color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:12px;color:var(--muted)}.form input{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);background:#0d1528;color:var(--text);border-radius:9px}.span2{grid-column:span 2}.checks{display:flex;gap:18px;align-items:center}.checks label{color:var(--text);font-size:13px}.msg{white-space:pre-wrap;font-size:13px;margin-top:10px;color:var(--muted)}code{color:#b7c6ff}.login{max-width:460px;margin:12vh auto}.hidden{display:none!important}@media(max-width:760px){.grid{grid-template-columns:1fr}.head{display:none}.form{grid-template-columns:1fr}.span2{grid-column:span 1}}
</style>
</head><body><div class="wrap">
<div id="login" class="card login"><h1>🎬 Emby Multi Proxy</h1><p class="sub">请输入安装时生成的管理 Token。Token 只保存在当前标签页。</p><input id="token" type="password" autocomplete="current-password" style="width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#0d1528;color:var(--text)"><div style="margin-top:12px"><button class="btn primary" onclick="login()">进入面板</button></div><div id="loginmsg" class="msg"></div></div>
<div id="app" class="hidden"><div class="top"><div><h1>🎬 Emby Multi Proxy <span class="badge">v__VERSION__</span></h1><div class="sub">轻量多站点反向代理管理面板</div></div><button class="btn" onclick="logout()">退出</button></div>
<div class="card"><div class="toolbar"><button class="btn primary" onclick="openForm()">＋ 新增站点</button><button class="btn" onclick="loadSites()">刷新</button><button class="btn" onclick="reloadNginx()">校验并重载 Nginx</button><button class="btn" onclick="exportSites()">导出</button><label class="btn">导入<input type="file" accept="application/json" onchange="importSites(this)" hidden></label></div><div id="status" class="msg"></div></div>
<div class="card"><div class="grid head"><div>名称</div><div>源站</div><div>访问路径</div><div>状态</div><div>操作</div></div><div id="sites"></div></div>
<div id="editor" class="card hidden"><h2 id="formtitle" style="font-size:17px;margin-top:0">新增站点</h2><div class="form"><div><label>名称<input id="name" placeholder="例如：Emby SG"></label></div><div><label>ID<input id="id" placeholder="例如：emby-sg"></label></div><div class="span2"><label>源站 URL<input id="upstream" placeholder="https://emby.example.com:443"></label></div><div><label>路径前缀<input id="path" placeholder="emby1；留空=根站点"></label></div><div><label>Host Header（可选）<input id="host_header" placeholder="通常留空"></label></div><div class="span2 checks"><label><input id="enabled" type="checkbox" checked> 启用</label><label><input id="insecure_tls" type="checkbox"> 跳过源站 TLS 校验（不推荐）</label></div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="saveSite()">保存</button><button class="btn" onclick="closeForm()">取消</button></div><div id="formmsg" class="msg"></div></div>
</div></div>
<script>
let token=sessionStorage.getItem('emby_proxy_token')||'';let sites=[];let editing='';
const $=id=>document.getElementById(id);
function headers(){return {'Authorization':'Bearer '+token,'Content-Type':'application/json'}}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...headers()};let r=await fetch(url,opt);let t=await r.text();let d={};try{d=JSON.parse(t)}catch{d={error:t}}if(r.status===401){logout();throw Error('Token 无效')}if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
function login(){token=$('token').value.trim();sessionStorage.setItem('emby_proxy_token',token);loadSites().catch(e=>$('loginmsg').textContent=e.message)}
function logout(){sessionStorage.removeItem('emby_proxy_token');token='';$('app').classList.add('hidden');$('login').classList.remove('hidden')}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden')}
async function loadSites(){let d=await api('/api/sites');sites=d.sites||[];render();showApp();$('status').textContent='Nginx: '+(d.nginx_ok?'正常':'异常')+' · '+(d.nginx_detail||'')}
function render(){let box=$('sites');box.textContent='';if(!sites.length){let d=document.createElement('div');d.className='msg';d.textContent='还没有站点，点击“新增站点”开始。';box.appendChild(d);return}for(const s of sites){let row=document.createElement('div');row.className='grid site';for(const v of [s.name,s.upstream,s.path?location.origin+'/'+s.path+'/':location.origin]){let d=document.createElement('div');d.textContent=v;row.appendChild(d)}let st=document.createElement('div');st.className=s.enabled?'ok':'off';st.textContent=s.enabled?'● 已启用':'○ 已停用';row.appendChild(st);let ops=document.createElement('div');let e=document.createElement('button');e.className='btn';e.textContent='编辑';e.onclick=()=>openForm(s.id);let del=document.createElement('button');del.className='btn danger';del.style.marginLeft='6px';del.textContent='删除';del.onclick=()=>removeSite(s.id);ops.append(e,del);row.appendChild(ops);box.appendChild(row)}}
function openForm(id=''){editing=id;let s=sites.find(x=>x.id===id)||{id:'',name:'',upstream:'',path:'',host_header:'',enabled:true,insecure_tls:false};$('formtitle').textContent=id?'编辑站点':'新增站点';for(const k of ['id','name','upstream','path','host_header'])$(k).value=s[k]||'';$('id').disabled=!!id;$('enabled').checked=!!s.enabled;$('insecure_tls').checked=!!s.insecure_tls;$('formmsg').textContent='';$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth'})}
function closeForm(){$('editor').classList.add('hidden')}
async function saveSite(){let s={id:$('id').value.trim(),name:$('name').value.trim(),upstream:$('upstream').value.trim(),path:$('path').value.trim(),host_header:$('host_header').value.trim(),enabled:$('enabled').checked,insecure_tls:$('insecure_tls').checked};$('formmsg').textContent='保存中…';try{await api('/api/sites/'+encodeURIComponent(editing||s.id),{method:'PUT',body:JSON.stringify(s)});closeForm();await loadSites()}catch(e){$('formmsg').textContent=e.message}}
async function removeSite(id){if(!confirm('确认删除这个站点？'))return;try{await api('/api/sites/'+encodeURIComponent(id),{method:'DELETE'});await loadSites()}catch(e){alert(e.message)}}
async function reloadNginx(){try{let d=await api('/api/reload',{method:'POST',body:'{}'});$('status').textContent=d.message||'重载成功'}catch(e){$('status').textContent=e.message}}
async function exportSites(){let d=await api('/api/export');let b=new Blob([JSON.stringify(d.sites,null,2)+'\n'],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='emby-multi-proxy-sites.json';a.click();URL.revokeObjectURL(a.href)}
async function importSites(inp){if(!inp.files?.[0])return;try{let text=await inp.files[0].text();let data=JSON.parse(text);let payload=Array.isArray(data)?data:(data.sites||[]);if(!confirm('导入会覆盖当前站点配置，继续？'))return;await api('/api/import',{method:'POST',body:JSON.stringify({sites:payload})});await loadSites()}catch(e){alert(e.message)}finally{inp.value=''}}
if(token)loadSites().catch(()=>logout());
</script></body></html>
